version: '3.9'

services:
  # ============ PostgreSQL Production ============
  postgres:
    image: postgres:15-alpine
    container_name: securetrack_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-securetrack}
      POSTGRES_USER: ${DB_USER:-securetrack_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securetrack_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securetrack_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============ Redis Cache ============
  redis:
    image: redis:7-alpine
    container_name: securetrack_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_me_in_production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - securetrack_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============ Django/Gunicorn Web ============
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securetrack_web
    command: >
      gunicorn
      --bind 0.0.0.0:8000
      --workers 4
      --worker-class sync
      --worker-tmp-dir /dev/shm
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 60
      --access-logfile -
      --error-logfile -
      securetrack.wsgi:application
    environment:
      DEBUG: "${DEBUG}"
      ENVIRONMENT: "${ENVIRONMENT}"
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ${DB_NAME:-securetrack}
      DATABASE_USER: ${DB_USER:-securetrack_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      USE_SQLITE: "False"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: 0
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      SECURE_HSTS_PRELOAD: "False"
    volumes:
      - ./src:/app/src
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - securetrack_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ============ Nginx Reverse Proxy ============
  nginx:
    image: nginx:alpine
    container_name: securetrack_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./logs:/var/log/nginx:rw
    depends_on:
      - web
    networks:
      - securetrack_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  securetrack_network:
    driver: bridge
